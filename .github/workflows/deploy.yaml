name: Build and Deploy to Cloud Run

on:
  push:
    branches: ["main"]

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  AR_REPO: ${{ vars.AR_REPO }}
  WEB_IMAGE: ${{ vars.WEB_IMAGE }}
  API_IMAGE: ${{ vars.API_IMAGE }}

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
          audience: https://github.com/kdilts13/portfolio

      - name: Who am I?
        run: |
          gcloud auth list
          gcloud config get-value account
          gcloud config get-value project

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $GCP_REGION-docker.pkg.dev --quiet

      # ===== API =====
      - name: Build API image with Cloud Build
        run: |
          gcloud builds submit ./api \
            --tag "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPO/$API_IMAGE:latest"

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy api \
            --image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPO/$API_IMAGE:latest" \
            --region="$GCP_REGION" \
            --service-account="run-api@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated

      - name: Get API URL
        id: apiurl
        run: |
          API_URL=$(gcloud run services describe api --region="$GCP_REGION" --format="value(uri)")
          echo "API_URL=$API_URL"
          echo "API_URL=$API_URL" >> $GITHUB_OUTPUT

      # ===== WEB =====
      # Uses your web/cloudbuild.yaml to pass NEXT_PUBLIC_API_BASE at build time
      - name: Build WEB image with Cloud Build (bakes NEXT_PUBLIC_API_BASE)
        run: |
          gcloud builds submit ./web \
            --config=web/cloudbuild.yaml \
            --substitutions=_NEXT_PUBLIC_API_BASE="${{ steps.apiurl.outputs.API_URL }}"

      - name: Deploy Web to Cloud Run
        run: |
          gcloud run deploy web \
            --image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPO/$WEB_IMAGE:latest" \
            --region="$GCP_REGION" \
            --service-account="run-web@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated
