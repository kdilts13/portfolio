spring.application.name=Portfolio API
app.cors.allowed-origins=http://localhost:3000,https://kdilts.net,https://www.kdilts.net

# AI feature flags / limits (override via env vars)
app.ai.enabled=false
app.ai.daily-run-limit-default=50
app.ai.max-resume-chars=20000
app.ai.max-job-desc-chars=20000
app.ai.max-output-tokens=4800
# Comma-separated allowlist for unlimited usage (Firebase UIDs)
app.ai.unlimited-uids=

# OpenAI settings
app.openai.api-key=${APP_OPENAI_API_KEY:}
app.openai.model=gpt-4.1-mini

# Multipart upload limits (override via env vars if desired)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Resume extraction limits
app.resume.max-pdf-bytes=10485760
